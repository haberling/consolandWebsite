<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L0SF9VQEKN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-L0SF9VQEKN');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  {{favicon}}
  <link rel="stylesheet" href="/css/framework.css">
  <link rel="stylesheet" href="/css/theme.css">
  {{widgetStyles}}
</head>
<body>
  <header class="site-header">
    <div class="site-header-top">
      <a class="site-title" href="/">{{logoImg}}{{siteName}}</a>
      <div class="site-tagline">
        <p>A website about software, which is really software about software.</p>
      </div>
    </div>
    <nav id="site-nav" class="site-nav">
      <!-- populated client-side from /content/manifest.json -->
    </nav>
  </header>

  <div id="logo-zoom-modal" class="logo-zoom-modal" hidden>
    <button type="button" class="logo-zoom-modal-close" aria-label="Close">&times;</button>
    <img class="logo-zoom-modal-img" src="" alt="">
  </div>

  <main id="app">{{content}}</main>

  <footer class="site-footer">
    <span>Consoland &mdash; Built with Canary</span>
    <span>&copy; 2026 Marcus Haberling</span>
  </footer>

  <script type="module" src="/js/main.js"></script>
  {{widgetScripts}}

  <script>
    (() => {
      const modal = document.getElementById('logo-zoom-modal');
      const modalImg = modal.querySelector('.logo-zoom-modal-img');
      const closeBtn = modal.querySelector('.logo-zoom-modal-close');

      function openModal(logoImg) {
        modalImg.src = logoImg.src;
        modalImg.alt = logoImg.alt;
        modal.hidden = false;
      }

      function closeModal() {
        modal.hidden = true;
        modalImg.src = '';
      }

      document.querySelectorAll('.site-logo').forEach((img) => {
        img.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          openModal(img);
        });
      });

      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.hidden) closeModal();
      });
    })();
  </script>
</body>
</html>
