<!--
  Site-authored widget (consolandWebsite/widgets/, not a Canary built-in --
  see WIDGETS.md in the canary repo for the discovery rules). Plain
  Mustache template, no JS sibling: a single inline line -- link icon,
  title, date -- not a bordered card. The icon is an inline SVG rather
  than an emoji glyph so it can be colored with currentColor/accent; an
  emoji ignores CSS color entirely on most platforms. Never write a
  literal double-brace tag in this comment block -- the templater has no
  notion of "this is a comment," see WIDGETS.md's gotcha section.

  "url" is a page's actual route, not a filesystem path: it's the file's
  content-root-relative path with ".md" stripped (an index.md instead maps
  to its own containing directory) -- see Canary.Core.Build.ContentScanner.
  No leading "content/" segment.
-->

</p>
