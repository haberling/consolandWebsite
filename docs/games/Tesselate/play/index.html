  <link rel="alternate" type="application/rss+xml" title="Consoland" href="/rss.xml">

<body>
  <header class="site-header">
    <div class="site-header-top">
      <a class="site-title" href="/"><img class="site-logo" src="/img/logo.png" alt="">Consoland</a>
      <div class="site-tagline">
        <p>A website about software, which is really software about software.</p>
      </div>
    </div>
    <nav id="site-nav" class="site-nav">
      
    </nav>
  </header>

  <div id="logo-zoom-modal" class="logo-zoom-modal" hidden>
    <button type="button" class="logo-zoom-modal-close" aria-label="Close">&times;</button>
    <img class="logo-zoom-modal-img" src="" alt="">
  </div>

  <main id="app"><h1>Play</h1>
<p>Same game, in the browser. Click the terminal to focus.</p>


<div class="wasmterm-frame"
     data-widget="wasmterm"
     data-wasmterm-app="/content/games/tesselate-wasm"
     data-wasmterm-cols="80"
     data-wasmterm-rows="32"
     data-wasmterm-fontsize="24">
  <div class="wasmterm-loading" data-wasmterm-loading>
    <div class="wasmterm-loading-label" data-wasmterm-loading-label>Loading…</div>
    <div class="wasmterm-loading-track"><div class="wasmterm-loading-fill" data-wasmterm-loading-fill></div></div>
  </div>
  <div class="wasmterm-viewport" data-wasmterm-viewport>
    <div data-wasmterm-mount></div>
  </div>
</div>

<p>First load pulls a large soundfont, so give it a second.</p></main>

  <footer class="site-footer">
    <span>Consoland &mdash; Built with Canary</span>

  <script type="module" src="/js/main.js"></script>
  <script src="/js/widgets/chirp.js" defer></script>
<script src="/js/widgets/downloads.js" defer></script>
<script src="/js/widgets/slideshow.js" defer></script>
<script src="/js/widgets/wasmterm.js" defer></script>


  <script>
    (() => {
      const modal = document.getElementById('logo-zoom-modal');
      const modalImg = modal.querySelector('.logo-zoom-modal-img');
      const closeBtn = modal.querySelector('.logo-zoom-modal-close');

      function openModal(logoImg) {
        modalImg.src = logoImg.src;
        modalImg.alt = logoImg.alt;
        modal.hidden = false;
      }

      function closeModal() {
        modal.hidden = true;
        modalImg.src = '';
      }

      document.querySelectorAll('.site-logo').forEach((img) => {
        img.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          openModal(img);
        });
      });

      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.hidden) closeModal();
      });
    })();
  </script>
</body>
</html>
